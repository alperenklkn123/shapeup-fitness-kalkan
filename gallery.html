<html lang="en">
<head>

  <title>Photo Gallery | Shape Training Club Kalkan</title>
  <style>
    :root{color-scheme:dark;--ink:#05090f;--surface:#081522;--surface-2:#0c1d2c;--line:rgba(164,202,236,.16);--line-strong:rgba(79,166,245,.42);--blue:#2489ff;--light:#69baff;--white:#f5f8fc;--muted:#91a7ba;--shell:min(1180px,calc(100vw - 42px));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:var(--ink);scroll-behavior:smooth}body{min-height:100vh;margin:0;color:var(--white);background:radial-gradient(circle at 76% -10%,rgba(36,137,255,.17),transparent 33%),linear-gradient(180deg,#07111b,#04090f);-webkit-font-smoothing:antialiased;overflow-x:hidden}body.lightbox-open{overflow:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:var(--shell);margin:auto}
    .topbar{position:sticky;z-index:20;top:0;min-height:82px;padding:12px max(21px,calc((100vw - 1180px)/2));border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(3,8,14,.9);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;gap:4px}.brand strong{font-size:24px;line-height:1;letter-spacing:.12em;font-weight:950}.brand strong i{color:var(--blue);font-style:normal}.brand em{color:#8fa5b9;font-size:7px;font-style:normal;font-weight:900;letter-spacing:.24em}.brand small{padding-left:13px;border-left:1px solid rgba(255,255,255,.23);color:#9fb1c3;font-size:9px;font-weight:850;letter-spacing:.22em}.langs{display:flex;gap:3px;padding:4px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.05)}.lang{height:36px;min-width:46px;padding:0 7px;border:0;border-radius:9px;display:grid;place-items:center;color:#8fa2b4;background:transparent;cursor:pointer;font-size:17px;transition:.2s}.lang:hover{transform:translateY(-1px)}.lang.active{color:#fff;background:linear-gradient(135deg,#1875de,#2d96ff);box-shadow:0 7px 18px rgba(36,137,255,.25)}
    main{min-height:calc(100vh - 82px)}.gallery-hero{position:relative;padding:clamp(65px,9vw,112px) 0 48px;overflow:hidden}.gallery-hero:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,transparent,rgba(36,137,255,.07),transparent);mask-image:linear-gradient(to bottom,#000,transparent)}.kicker{margin:0 0 17px;color:var(--light);font-size:10px;font-weight:950;letter-spacing:.28em}.gallery-hero h1{max-width:820px;margin:0;font-size:clamp(45px,8vw,92px);line-height:.92;letter-spacing:-.058em;font-weight:950;text-wrap:balance}.intro{max-width:650px;margin:23px 0 0;color:#a7b9c9;font-size:clamp(14px,1.8vw,17px);line-height:1.7}.hero-meta{margin-top:27px;display:flex;align-items:center;gap:11px;color:#71889c;font-size:9px;font-weight:850;letter-spacing:.08em}.hero-meta span{width:34px;height:1px;background:var(--light);box-shadow:0 0 10px var(--blue)}
    .gallery-content{padding:0 0 100px}.category-nav-wrap{position:sticky;z-index:12;top:82px;padding:10px 0;background:linear-gradient(180deg,rgba(5,9,15,.98),rgba(5,9,15,.87));backdrop-filter:blur(15px)}.category-nav{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}.category-nav::-webkit-scrollbar{display:none}.category-tab{min-height:46px;padding:0 17px;border:1px solid var(--line);border-radius:12px;flex:0 0 auto;color:#92a7ba;background:rgba(10,26,40,.72);cursor:pointer;font-size:10px;font-weight:900;letter-spacing:.035em;transition:.2s}.category-tab:hover{border-color:var(--line-strong);color:#d8e9f7}.category-tab.active{border-color:rgba(71,164,251,.72);color:#fff;background:linear-gradient(145deg,rgba(27,126,222,.75),rgba(9,52,88,.95));box-shadow:0 12px 30px rgba(15,109,201,.22)}
    .category-heading{padding:38px 0 22px;display:flex;align-items:end;justify-content:space-between;gap:20px}.category-heading h2{margin:0;font-size:clamp(28px,4vw,46px);line-height:1;letter-spacing:-.04em}.photo-count{color:#70879b;font-size:9px;font-weight:900;letter-spacing:.13em}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.photo-card{position:relative;min-width:0;aspect-ratio:4/3;padding:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#091522;cursor:zoom-in;box-shadow:0 18px 48px rgba(0,0,0,.18);isolation:isolate}.photo-card:nth-child(5n+1){grid-column:span 2;aspect-ratio:16/9}.photo-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s ease,filter .3s}.photo-card:after{content:"↗";position:absolute;right:13px;bottom:13px;width:36px;height:36px;border:1px solid rgba(255,255,255,.2);border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(3,10,16,.58);backdrop-filter:blur(9px);opacity:0;transform:translateY(5px);transition:.2s}.photo-card:hover img{transform:scale(1.035)}.photo-card:hover:after{opacity:1;transform:none}.empty-state{min-height:320px;padding:36px;border:1px dashed rgba(92,172,246,.3);border-radius:23px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,rgba(11,29,44,.65),rgba(5,14,23,.8))}.empty-state-inner{max-width:450px}.empty-icon{width:64px;height:64px;margin:0 auto 19px;border:1px solid rgba(92,172,246,.32);border-radius:19px;display:grid;place-items:center;color:#73c0ff;background:rgba(36,137,255,.1)}.empty-icon svg{width:29px}.empty-state strong{display:block;font-size:18px}.empty-state p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
    .back-row{padding-top:34px;display:flex;justify-content:center}.back-link{min-height:50px;padding:0 20px;border:1px solid var(--line);border-radius:13px;display:inline-flex;align-items:center;gap:10px;color:#bed0df;background:rgba(10,26,40,.75);font-size:10px;font-weight:900;transition:.2s}.back-link:hover{border-color:var(--line-strong);transform:translateY(-2px)}footer{padding:33px 0 calc(33px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);color:#60778b;text-align:center;font-size:8px;font-weight:800;letter-spacing:.11em}
    .lightbox{position:fixed;z-index:100;inset:0;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;place-items:center;background:rgba(1,5,9,.94);backdrop-filter:blur(18px)}.lightbox[hidden]{display:none}.lightbox-stage{position:relative;width:min(1160px,100%);height:min(84vh,850px);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px}.lightbox-image-wrap{min-height:0;display:grid;place-items:center}.lightbox img{max-width:100%;max-height:100%;border-radius:16px;display:block;object-fit:contain;box-shadow:0 30px 100px rgba(0,0,0,.5)}.lightbox-caption{min-height:28px;margin:0;color:#c0cfdb;text-align:center;font-size:11px}.lightbox-close,.lightbox-control{position:absolute;z-index:2;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;background:rgba(7,18,28,.75);backdrop-filter:blur(10px);cursor:pointer}.lightbox-close{top:0;right:0;width:44px;height:44px;border-radius:13px;font-size:25px}.lightbox-control{top:50%;width:48px;height:54px;border-radius:14px;transform:translateY(-50%);font-size:24px}.lightbox-prev{left:0}.lightbox-next{right:0}.lightbox-counter{position:absolute;top:10px;left:50%;padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;transform:translateX(-50%);color:#b7c8d6;background:rgba(7,18,28,.7);font-size:9px;font-weight:900}.lightbox-control:disabled{display:none}
    @media(max-width:780px){:root{--shell:calc(100vw - 32px)}.topbar{min-height:112px;padding:12px 16px}.brand{gap:10px}.brand strong{font-size:21px}.brand small{font-size:8px}.langs{padding:3px}.lang{min-width:42px;height:35px}.gallery-hero{padding:57px 0 34px}.gallery-hero h1{font-size:clamp(43px,13vw,65px)}.category-nav-wrap{top:112px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-card,.photo-card:nth-child(5n+1){grid-column:auto;aspect-ratio:4/3;border-radius:15px}.photo-card:nth-child(3n+1){grid-column:1/-1;aspect-ratio:16/10}.photo-card:after{opacity:1;transform:none;width:31px;height:31px}.category-heading{padding-top:28px}.lightbox{padding:12px}.lightbox-stage{height:88vh}.lightbox-control{top:auto;bottom:1px;width:46px;height:46px}.lightbox-prev{left:5px}.lightbox-next{right:5px}.lightbox-caption{padding:0 60px}}
    @media(max-width:520px){.brand small{display:none}.brand em{font-size:6px}.topbar{gap:10px}.langs{gap:1px}.lang{min-width:39px;padding:0 5px}.gallery-hero h1{font-size:42px}.intro{font-size:14px}.category-tab{min-height:43px;padding:0 14px}.photo-grid{grid-template-columns:1fr}.photo-card,.photo-card:nth-child(3n+1),.photo-card:nth-child(5n+1){grid-column:auto;aspect-ratio:4/3}.empty-state{min-height:280px;padding:25px}.category-heading{align-items:flex-start;flex-direction:column;gap:8px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.photo-card img,.photo-card:after,.category-tab,.back-link{transition:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Shape Training Club ana sayfa">
      <span class="brand-mark"><strong>SH<i>A</i>PE</strong><em>TRAINING CLUB</em></span><small>KALKAN</small>
    </a>
    <div class="langs" aria-label="Language selection">
      <button class="lang" type="button" data-lang="en" aria-label="English">🇬🇧</button>
      <button class="lang" type="button" data-lang="tr" aria-label="Türkçe">🇹🇷</button>
      <button class="lang" type="button" data-lang="de" aria-label="Deutsch">🇩🇪</button>
      <button class="lang" type="button" data-lang="ru" aria-label="Русский">🇷🇺</button>
    </div>
  </header>

  <main>
    <section class="gallery-hero">
      <div class="shell">
        <p class="kicker" data-i18n="galleryKicker">DISCOVER SHAPE</p>
        <h1 data-i18n="galleryTitle">Explore the club.</h1>
        <p class="intro" data-i18n="galleryIntro">Take a closer look at our training areas and facilities.</p>
        <p class="hero-meta"><span aria-hidden="true"></span>SHAPE TRAINING CLUB · KALKAN</p>
      </div>
    </section>

    <section class="gallery-content" aria-live="polite">
      <div class="category-nav-wrap"><nav class="shell category-nav" id="categoryNav" aria-label="Gallery categories"></nav></div>
      <div class="shell">
        <div class="category-heading"><h2 id="categoryTitle"></h2><span class="photo-count" id="photoCount"></span></div>
        <div class="photo-grid" id="photoGrid">
          <div class="empty-state"><div class="empty-state-inner"><span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m5 18 4-4 3 3 3-4 4 5"/></svg></span><strong data-i18n="galleryLoading">Gallery is loading…</strong></div></div>
        </div>
        <div class="back-row"><a class="back-link" href="./"><span aria-hidden="true">←</span><span data-i18n="galleryBack">Back to the main site</span></a></div>
      </div>
    </section>
  </main>

  <footer><div class="shell">© 2026 SHAPE TRAINING CLUB · KALKAN</div></footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lightbox-stage">
      <button class="lightbox-close" type="button" id="lightboxClose" aria-label="Close">×</button>
      <span class="lightbox-counter" id="lightboxCounter"></span>
      <button class="lightbox-control lightbox-prev" type="button" id="lightboxPrev" aria-label="Previous photo">‹</button>
      <div class="lightbox-image-wrap"><img id="lightboxImage" alt=""></div>
      <button class="lightbox-control lightbox-next" type="button" id="lightboxNext" aria-label="Next photo">›</button>
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="site-defaults.js?v=17"></script>
  <script>
    (() => {
      "use strict";
      const LANGUAGES = ["en", "tr", "de", "ru"];
      const clone = value => JSON.parse(JSON.stringify(value || {}));
      const defaults = clone(window.SHAPE_DEFAULTS || {});
      let config = defaults;
      let language = getInitialLanguage();
      let activeCategoryId = "";
      let lightboxPhotos = [];
      let lightboxIndex = 0;

      function getInitialLanguage() {
        try {
          const saved = localStorage.getItem("shape-language");
          if (LANGUAGES.includes(saved)) return saved;
        } catch (error) {}
        const browserLanguage = String(navigator.language || "en").slice(0, 2).toLowerCase();
        return LANGUAGES.includes(browserLanguage) ? browserLanguage : "en";
      }

      function mergeConfig(base, custom) {
        const source = custom && typeof custom === "object" ? custom : {};
        const merged = Object.assign({}, clone(base), clone(source));
        merged.gallery = Object.assign({}, clone(base.gallery || {}), clone(source.gallery || {}));
        merged.gallery.categories = Array.isArray((source.gallery || {}).categories)
          ? clone(source.gallery.categories)
          : clone((base.gallery || {}).categories || []);
        merged.translations = {};
        LANGUAGES.forEach(code => {
          merged.translations[code] = Object.assign({}, clone((base.translations || {})[code] || {}), clone((source.translations || {})[code] || {}));
        });
        return merged;
      }

      function t(key) {
        return (((config.translations || {})[language] || {})[key]) || (((config.translations || {}).en || {})[key]) || key;
      }

      function localised(values, fallback) {
        const source = values && typeof values === "object" ? values : {};
        return String(source[language] || source.en || source.tr || fallback || "");
      }

      function validImageUrl(value) {
        try {
          const url = new URL(String(value || ""), window.location.href);
          return ["https:", "http:"].includes(url.protocol) ? url.href : "";
        } catch (error) { return ""; }
      }

      function activeCategories() {
        return (((config.gallery || {}).categories) || []).filter(category => category && category.active !== false);
      }

      function selectInitialCategory(categories) {
        const requested = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (categories.some(category => String(category.id) === requested)) return requested;
        if (categories.some(category => String(category.id) === activeCategoryId)) return activeCategoryId;
        return categories[0] ? String(categories[0].id) : "";
      }

      function applyTranslations() {
        document.documentElement.lang = language;
        document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
        document.querySelectorAll("[data-lang]").forEach(button => {
          const active = button.dataset.lang === language;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function render() {
        applyTranslations();
        const categories = activeCategories();
        activeCategoryId = selectInitialCategory(categories);
        const current = categories.find(category => String(category.id) === activeCategoryId) || categories[0];
        renderCategoryNav(categories);
        renderPhotos(current);
      }

      function renderCategoryNav(categories) {
        const navigation = document.getElementById("categoryNav");
        navigation.replaceChildren();
        categories.forEach((category, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "category-tab" + (String(category.id) === activeCategoryId ? " active" : "");
          button.textContent = localised(category.names, `Category ${index + 1}`);
          button.setAttribute("aria-pressed", String(String(category.id) === activeCategoryId));
          button.addEventListener("click", () => {
            activeCategoryId = String(category.id);
            history.replaceState(null, "", `#${encodeURIComponent(activeCategoryId)}`);
            render();
            document.querySelector(".category-heading").scrollIntoView({ behavior: "smooth", block: "start" });
          });
          navigation.append(button);
        });
      }

      function renderPhotos(category) {
        const title = document.getElementById("categoryTitle");
        const count = document.getElementById("photoCount");
        const grid = document.getElementById("photoGrid");
        grid.replaceChildren();
        if (!category) {
          title.textContent = t("galleryTitle");
          count.textContent = "";
          grid.append(createEmptyState());
          return;
        }
        title.textContent = localised(category.names);
        const photos = (Array.isArray(category.photos) ? category.photos : [])
          .map(photo => ({ url: validImageUrl(photo.url), alt: localised(photo.alt, title.textContent) }))
          .filter(photo => photo.url);
        count.textContent = photos.length ? `${String(photos.length).padStart(2, "0")} PHOTO${photos.length === 1 ? "" : "S"}` : "";
        if (!photos.length) {
          grid.append(createEmptyState());
          return;
        }
        photos.forEach((photo, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "photo-card";
          button.setAttribute("aria-label", `${title.textContent} · ${index + 1}`);
          const image = document.createElement("img");
          image.src = photo.url;
          image.alt = photo.alt;
          image.loading = index < 2 ? "eager" : "lazy";
          image.decoding = "async";
          button.append(image);
          button.addEventListener("click", () => openLightbox(photos, index));
          grid.append(button);
        });
      }

      function createEmptyState() {
        const wrapper = document.createElement("div");
        wrapper.className = "empty-state";
        const inner = document.createElement("div");
        inner.className = "empty-state-inner";
        const icon = document.createElement("span");
        icon.className = "empty-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m5 18 4-4 3 3 3-4 4 5"/></svg>';
        const strong = document.createElement("strong");
        strong.textContent = t("galleryEmpty");
        const paragraph = document.createElement("p");
        paragraph.textContent = localised({ en: "Please check this category again soon.", tr: "Bu kategoriyi kısa süre sonra tekrar kontrol edebilirsiniz.", de: "Schau bald wieder in dieser Kategorie vorbei.", ru: "Загляните в этот раздел немного позже." });
        inner.append(icon, strong, paragraph);
        wrapper.append(inner);
        return wrapper;
      }

      function openLightbox(photos, index) {
        lightboxPhotos = photos;
        lightboxIndex = index;
        updateLightbox();
        document.getElementById("lightbox").hidden = false;
        document.body.classList.add("lightbox-open");
        document.getElementById("lightboxClose").focus();
      }

      function updateLightbox() {
        const photo = lightboxPhotos[lightboxIndex];
        if (!photo) return;
        const image = document.getElementById("lightboxImage");
        image.src = photo.url;
        image.alt = photo.alt;
        document.getElementById("lightboxCaption").textContent = photo.alt;
        document.getElementById("lightboxCounter").textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
        const onlyOne = lightboxPhotos.length < 2;
        document.getElementById("lightboxPrev").disabled = onlyOne;
        document.getElementById("lightboxNext").disabled = onlyOne;
      }

      function moveLightbox(direction) {
        if (lightboxPhotos.length < 2) return;
        lightboxIndex = (lightboxIndex + direction + lightboxPhotos.length) % lightboxPhotos.length;
        updateLightbox();
      }

      function closeLightbox() {
        document.getElementById("lightbox").hidden = true;
        document.body.classList.remove("lightbox-open");
        document.getElementById("lightboxImage").removeAttribute("src");
      }

      async function loadRemoteConfig() {
        const supabaseConfig = window.SHAPE_SUPABASE || {};
        if (!window.supabase || !supabaseConfig.url || !supabaseConfig.publishableKey) return;
        try {
          const client = window.supabase.createClient(supabaseConfig.url, supabaseConfig.publishableKey);
          const { data, error } = await client.from("site_config").select("content").eq("id", 1).maybeSingle();
          if (error) throw error;
          if (data && data.content) {
            config = mergeConfig(defaults, data.content);
            render();
          }
        } catch (error) {
          console.warn("Galeri güncel içeriği alınamadı; yedek içerik gösteriliyor.", error);
        }
      }

      document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
        language = button.dataset.lang;
        try { localStorage.setItem("shape-language", language); } catch (error) {}
        render();
      }));
      document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
      document.getElementById("lightboxPrev").addEventListener("click", () => moveLightbox(-1));
      document.getElementById("lightboxNext").addEventListener("click", () => moveLightbox(1));
      document.getElementById("lightbox").addEventListener("click", event => { if (event.target === event.currentTarget) closeLightbox(); });
      document.addEventListener("keydown", event => {
        if (document.getElementById("lightbox").hidden) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") moveLightbox(-1);
        if (event.key === "ArrowRight") moveLightbox(1);
      });
      window.addEventListener("hashchange", render);

      render();
      loadRemoteConfig();
    })();
  </script>
</body>
</html>
